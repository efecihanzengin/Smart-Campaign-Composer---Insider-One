services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d campaign"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    command: ["campaign", "api"]
    environment:
      DATABASE_URL: postgres://campaign:campaign@postgres:5432/campaign?sslmode=disable
      HTTP_ADDR: :8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      PROVIDER_URL: http://provider:8081
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["campaign", "worker"]
    environment:
      DATABASE_URL: postgres://campaign:campaign@postgres:5432/campaign?sslmode=disable
      PROVIDER_URL: http://provider:8081
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-}
    depends_on:
      api:
        # The API runs migrations and the seed before it reports healthy.
        condition: service_healthy
      provider:
        condition: service_started
    restart: unless-stopped

  provider:
    build: ./backend
    command: ["provider"]
    environment:
      HTTP_ADDR: :8081
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    restart: unless-stopped

  # Used by `make test` only when Go is not installed on the host.
  gotest:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://campaign:campaign@postgres:5432/campaign?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
